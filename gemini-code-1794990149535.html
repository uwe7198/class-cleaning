<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級打掃工作分配系統</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .card {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
        .card:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 班級打掃輪值表</h1>
        <div id="schedule-board">
            載入中...
        </div>
    </div>

    <script>
        const cleaningData = [
            { area: "黑板與講台", members: ["王小明", "李小華"] },
            { area: "教室地板", members: ["張大為", "陳美麗"] },
            { area: "走廊與陽台", members: ["林志豪", "黃雅婷"] },
            { area: "資源回收區", members: ["周杰倫", "蔡依林"] }
        ];

        const board = document.getElementById('schedule-board');
        let html = '';
        cleaningData.forEach(item => {
            html += `<div class="card">
                <h3>📍 ${item.area}</h3>
                <p>值日生：${item.members.join(', ')}</p>
            </div>`;
        });
        board.innerHTML = html;
    </script>
</body>
</html>
